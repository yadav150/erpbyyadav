<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Students – Morning Glory English Academy</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- SIDEBAR (SAME AS INDEX) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="2" width="32" height="32" rx="8" stroke="#4F46E5" stroke-width="3" />
                <path d="M10 26V10H18C20.5 10 22.5 11.5 22.5 14C22.5 16.5 20.5 18 18 18H14M22 26L18 18H14L10 26" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M26 18V26M26 18H22M26 18H30" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
            </svg>
            <span class="brand-text">Morning Glory</span>
        </div>
        <nav class="sidebar-nav">
            <a href="index.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M2 10L10 2L18 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 8V16H16V8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="7" y="12" width="6" height="4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Dashboard</span></a>
            <a href="students.html" class="nav-link active"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 17C3 14.2386 5.23858 12 8 12H12C14.7614 12 17 14.2386 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Students</span></a>
            <a href="teachers.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="6" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M3 16C3 13.2386 5.23858 11 8 11H12C14.7614 11 17 13.2386 17 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="8" y="14" width="4" height="4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Teachers</span></a>
            <a href="fees.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M7 10H13M10 7V13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Fees</span></a>
            <a href="salary.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7 9H13M7 13H11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Salary</span></a>
            <a href="reports.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="12" width="4" height="6" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="8" y="8" width="4" height="10" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><rect x="14" y="4" width="4" height="14" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Reports</span></a>
            <a href="settings.html" class="nav-link"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M10 2V4M10 16V18M4 10H2M18 10H16M5.5 5.5L4 4M15.5 15.5L17 17M5.5 14.5L4 16M15.5 4.5L17 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Settings</span></a>
        </nav>
        <div class="sidebar-footer"><span class="version">v2.0</span><span class="school-name">Morning Glory English Academy</span></div>
    </aside>

    <div class="main-wrapper" id="mainWrapper">
        <header class="top-header">
            <div class="header-left"><button class="hamburger" id="hamburgerBtn" aria-label="Toggle navigation"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 6H21M3 12H21M3 18H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button><h1 class="page-title">Students</h1></div>
            <div class="header-right"><span class="greeting">Welcome, Admin</span><div class="avatar"><svg width="36" height="36" viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="16" stroke="#E5E7EB" stroke-width="2"/><circle cx="18" cy="13" r="5" stroke="#E5E7EB" stroke-width="2"/><path d="M6 29C6 24.0294 10.0294 20 15 20H21C25.9706 20 30 24.0294 30 29" stroke="#E5E7EB" stroke-width="2" stroke-linecap="round"/></svg></div></div>
        </header>

        <main class="page-content">
            <div class="action-bar">
                <div class="left">
                    <input type="text" class="form-input" id="searchStudent" placeholder="Search by name or roll no..." style="width:260px;" />
                    <select class="form-select" id="classFilter" style="width:160px;"><option value="">All Classes</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select>
                </div>
                <button class="btn-sm btn-primary" onclick="window.openModal('studentModal')">+ Add Student</button>
            </div>

            <div class="card">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead><tr><th>Roll No</th><th>Name</th><th>Class</th><th>Guardian</th><th>Contact</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="studentsTableBody"><tr class="empty-row"><td colspan="7">Loading students...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </main>

        <footer class="site-footer"><div class="footer-content"><span>&copy; 2026 <strong>Morning Glory English Academy</strong></span><span>Developed by <strong>Yadab Web Technologies</strong></span></div></footer>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-backdrop"></div>
    <div class="modal" id="studentModal">
        <div class="modal-content">
            <div class="modal-header"><h3>Add / Edit Student</h3><button class="modal-close">&times;</button></div>
            <form id="studentForm">
                <input type="hidden" id="studentId" />
                <div class="form-row">
                    <div class="form-group"><label>Roll No</label><input type="text" class="form-input" id="rollNo" placeholder="e.g. S001" required /></div>
                    <div class="form-group"><label>Full Name</label><input type="text" class="form-input" id="studentName" placeholder="e.g. Rahul Sharma" required /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Class</label><select class="form-select" id="studentClass"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select></div>
                    <div class="form-group"><label>Guardian Name</label><input type="text" class="form-input" id="guardian" placeholder="e.g. Mr. Sharma" /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Contact</label><input type="text" class="form-input" id="studentContact" placeholder="+91 98765 43210" /></div>
                    <div class="form-group"><label>Status</label><select class="form-select" id="studentStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
                </div>
                <div class="form-group"><label>Address</label><textarea class="form-input" id="studentAddress" rows="2" placeholder="Full address"></textarea></div>
                <div class="modal-footer">
                    <button type="button" class="btn-sm modal-cancel">Cancel</button>
                    <button type="submit" class="btn-sm btn-primary">Save Student</button>
                </div>
            </form>
        </div>
    </div>

    <div class="sidebar-overlay"></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
