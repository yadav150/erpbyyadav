<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students · School ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/students.css">
</head>
<body>
  <nav class="navbar">...</nav> <!-- Same as index -->
  <main class="container" style="padding-top: 32px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
      <h1>Student Management</h1>
      <button class="btn btn-primary" onclick="openModal('addStudentModal')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Student
      </button>
    </div>

    <!-- Filters (wide) -->
    <div class="card" style="display: flex; flex-wrap: wrap; gap: 20px; align-items: end;">
      <div class="form-group" style="flex:2; min-width:180px;"><label>Search</label><input type="text" id="searchInput" placeholder="Name, class..." oninput="filterStudents()"></div>
      <div class="form-group" style="flex:1; min-width:140px;"><label>Class</label><select id="classFilter" onchange="filterStudents()"><option value="">All</option><option value="9">9</option><option value="10">10</option></select></div>
      <div class="form-group" style="flex:1; min-width:140px;"><label>Sort by</label><select id="sortBy" onchange="filterStudents()"><option value="name">Name</option><option value="class">Class</option><option value="rollNo">Roll No</option></select></div>
      <div class="form-group" style="flex:0;"><button class="btn btn-outline-secondary" onclick="clearFilters()">Clear</button></div>
    </div>

    <!-- Students Table -->
    <div class="card">
      <div class="table-responsive">
        <table>
          <thead><tr><th>Name</th><th>Class</th><th>Section</th><th>Roll No</th><th>Email</th><th>Phone</th><th style="text-align:center;">Actions</th></tr></thead>
          <tbody id="studentsTableBody">
            <tr><td colspan="7" style="text-align:center; color:var(--text-muted);">No students found. Click "Add Student" to get started.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="addStudentModal">... (same form as before) ...</div>

  <footer class="footer"><div class="container">Yadav Web technologies</div></footer>
  <script src="js/script.js"></script>
  <script src="js/students.js"></script>
</body>
</html>
