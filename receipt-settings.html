<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipts · School ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/receipts.css">
  <link rel="stylesheet" href="css/search.css">
  
  <!-- ===== FIREBASE SDK ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
</head>
<body>
  <!-- ========== NAVBAR ========== -->
  <nav class="navbar">
    <div class="container" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
      <span class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 6V4M8 6V4M16 6V4M4 6h16v14H4z"/>
          <path d="M8 10h8M8 14h6"/>
        </svg>
        School ERP
      </span>
      <div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap;">
        <div class="nav-links">
          <a href="index.html">Dashboard</a>
          <a href="students.html">Students</a>
          <a href="fees.html">Fees</a>
          <a href="receipts.html" class="active">Receipts</a>
          <a href="receipt-settings.html">Settings</a>
        </div>
        <div class="search-container">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="globalSearchInput" placeholder="Search students...">
          <div class="search-results" id="globalSearchResults"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="container" style="padding-top: 32px;">
    <h1 style="margin-bottom: 20px; font-weight: 600;">Receipt Management</h1>

    <!-- Toolbar -->
    <div class="card" style="padding: 16px 20px; margin-bottom: 20px;">
      <div class="receipt-toolbar">
        <div class="toolbar-left">
          <div class="search-wrapper">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="receiptSearch" placeholder="Search receipts...">
          </div>
          <div class="receipt-filter-group">
            <select id="receiptStatusFilter">
              <option value="">All Status</option>
              <option value="paid">Paid</option>
              <option value="void">Void</option>
            </select>
            <select id="receiptDateFilter">
              <option value="">All Time</option>
              <option value="today">Today</option>
              <option value="week">This Week</option>
              <option value="month">This Month</option>
              <option value="year">This Year</option>
            </select>
          </div>
        </div>
        <div class="toolbar-right">
          <a href="receipt-settings.html" class="btn btn-outline-secondary" style="height:38px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 15v2m0-4v-2m0-4V5m-2 10h4m-4-4h4m-4-4h4"/>
              <circle cx="12" cy="12" r="10"/>
            </svg>
            Settings
          </a>
        </div>
      </div>

      <!-- Stats Bar -->
      <div class="table-stats">
        <div class="stats-left">
          <span>Total: <strong id="receiptTotalCount">0</strong></span>
          <span>Filtered: <strong id="receiptFilteredCount">0</strong></span>
        </div>
        <div class="stats-right">
          <span style="font-size:13px;">Rows:</span>
          <select id="receiptPageSizeSelect">
            <option value="10">10</option>
            <option value="25" selected>25</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="card" style="padding: 0; overflow: hidden;">
      <div class="receipt-table-wrap">
        <table class="receipt-table">
          <thead>
            <tr>
              <th style="width:40px;">#</th>
              <th data-sort="receiptNo" style="cursor:pointer; min-width:140px;">
                Receipt No <span class="sort-icon">↕</span>
              </th>
              <th data-sort="student" style="cursor:pointer; min-width:140px;">
                Student <span class="sort-icon">↕</span>
              </th>
              <th>Class</th>
              <th data-sort="amount" style="cursor:pointer; text-align:right;">
                Amount <span class="sort-icon">↕</span>
              </th>
              <th data-sort="date" style="cursor:pointer;">
                Date <span class="sort-icon">↕</span>
              </th>
              <th data-sort="status" style="cursor:pointer;">
                Status <span class="sort-icon">↕</span>
              </th>
              <th style="text-align:center; min-width:180px;">Actions</th>
            </tr>
          </thead>
          <tbody id="receiptTableBody">
            <tr>
              <td colspan="8" style="text-align:center; color:var(--text-muted); padding: 60px 20px;">
                Loading receipts...
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div style="padding: 12px 20px; border-top: 1px solid var(--border-color);">
        <div class="pagination-wrap">
          <div class="pagination-info" id="receiptPageInfo">0 receipts</div>
          <div class="pagination-controls">
            <button id="receiptPrevPage" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
            </button>
            <button id="receiptNextPage">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ========== RECEIPT PREVIEW MODAL ========== -->
  <div class="modal-overlay" id="receiptPreviewModal">
    <div class="modal" style="max-width: 700px;">
      <div class="modal-header">
        <h3>Receipt Preview</h3>
        <button class="modal-close" onclick="closeModal('receiptPreviewModal')">&times;</button>
      </div>
      <div id="receiptPreviewContent">
        <!-- dynamically filled by receipts.js -->
      </div>
      <div style="display: flex; gap: 12px; justify-content: end; margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 16px;">
        <button class="btn btn-primary" onclick="window.print()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M18 9H6"/>
            <rect x="6" y="14" width="12" height="8"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/>
          </svg>
          Print / PDF
        </button>
        <button class="btn btn-outline-secondary" onclick="closeModal('receiptPreviewModal')">Close</button>
      </div>
    </div>
  </div>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="container">Yadav Web technologies</div>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/firebase-config.js"></script>
  <script src="js/script.js"></script>
  <script src="js/search.js"></script>
  <script src="js/receipts.js"></script>
</body>
</html>
