<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt Settings · School ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/receipts.css">
  <link rel="stylesheet" href="css/search.css">
  
  <!-- ===== FIREBASE SDK ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
</head>
<body>
  <!-- ========== NAVBAR ========== -->
  <nav class="navbar">
    <div class="container" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
      <span class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 6V4M8 6V4M16 6V4M4 6h16v14H4z"/>
          <path d="M8 10h8M8 14h6"/>
        </svg>
        School ERP
      </span>
      <div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap;">
        <div class="nav-links">
          <a href="index.html">Dashboard</a>
          <a href="students.html">Students</a>
          <a href="fees.html">Fees</a>
          <a href="receipts.html">Receipts</a>
          <a href="receipt-settings.html" class="active">Settings</a>
        </div>
        <div class="search-container">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="globalSearchInput" placeholder="Search students...">
          <div class="search-results" id="globalSearchResults"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="container" style="padding-top: 32px;">
    <h1 style="margin-bottom: 20px; font-weight: 600;">Receipt Settings</h1>

    <div class="card">
      <form id="receiptSettingsForm">
        <div class="settings-grid">
          <div class="form-group">
            <label>School Name</label>
            <input type="text" id="settingSchoolName" placeholder="Yadav School ERP">
          </div>
          <div class="form-group">
            <label>Receipt Title</label>
            <input type="text" id="settingReceiptTitle" placeholder="Payment Receipt">
          </div>
          <div class="form-group" style="grid-column: span 2;">
            <label>School Address</label>
            <input type="text" id="settingSchoolAddress" placeholder="123 Education Street, City, State">
          </div>
          <div class="form-group">
            <label>Contact Number</label>
            <input type="text" id="settingContactNumber" placeholder="+91 9876543210">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="settingEmail" placeholder="info@yadavschool.edu">
          </div>
          <div class="form-group">
            <label>Website</label>
            <input type="text" id="settingWebsite" placeholder="www.yadavschool.edu">
          </div>
          <div class="form-group" style="grid-column: span 2;">
            <label>Footer Text</label>
            <textarea id="settingFooterText" rows="2" placeholder="Thank you for your payment. This is a system-generated receipt."></textarea>
          </div>
        </div>

        <div class="settings-actions">
          <button type="button" class="btn btn-outline-secondary" id="resetSettingsBtn">
            Reset to Defaults
          </button>
          <button type="button" class="btn btn-primary" id="saveSettingsBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            Save Settings
          </button>
        </div>
      </form>
    </div>

    <div style="margin-top: 20px;">
      <a href="receipts.html" class="btn btn-outline-secondary">
        ← Back to Receipts
      </a>
    </div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="container">Yadav Web technologies</div>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/firebase-config.js"></script>
  <script src="js/script.js"></script>
  <script src="js/search.js"></script>
  <script src="js/receipt-settings.js"></script>
</body>
</html>
