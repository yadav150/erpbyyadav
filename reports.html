<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reports – Morning Glory English Academy</title><link rel="stylesheet" href="css/style.css" /></head>
<body>
    <!-- SIDEBAR (active = reports) -->
    <aside class="sidebar" id="sidebar"> <!-- copy, set active to reports --> </aside>
    <div class="main-wrapper" id="mainWrapper">
        <header class="top-header"><!-- same --></header>
        <main class="page-content">
            <h2 style="margin-bottom:24px;">Financial Overview</h2>
            <section class="stats-grid">
                <div class="stat-card"><div class="stat-icon blue"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="10" stroke="currentColor" stroke-width="2"/><path d="M8 14H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><div class="stat-info"><span class="stat-label">Total Collection (₹)</span><span class="stat-value">0</span></div></div>
                <div class="stat-card"><div class="stat-icon orange"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><rect x="4" y="7" width="20" height="16" rx="3" stroke="currentColor" stroke-width="2"/><path d="M9 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><div class="stat-info"><span class="stat-label">Total Salaries (₹)</span><span class="stat-value">0</span></div></div>
                <div class="stat-card"><div class="stat-icon green"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><path d="M14 4V24M4 14H24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><div class="stat-info"><span class="stat-label">Net Balance (₹)</span><span class="stat-value">0</span></div></div>
                <div class="stat-card"><div class="stat-icon purple"><svg width="28" height="28" viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="10" stroke="currentColor" stroke-width="2"/><path d="M14 10V18M10 14H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div><div class="stat-info"><span class="stat-label">Pending Dues (₹)</span><span class="stat-value">0</span></div></div>
            </section>
            <div class="card" style="margin-top:12px;"><p class="text-muted">Detailed reports will be generated once data is synced with the backend.</p></div>
        </main>
        <footer class="site-footer"><!-- same --></footer>
    </div>
    <div class="sidebar-overlay"></div>
    <script src="js/script.js"></script>
</body>
</html>
