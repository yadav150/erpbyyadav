<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile · School ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/search.css">
  
  <!-- ===== FIREBASE SDK ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
</head>
<body>
  <!-- ========== NAVBAR ========== -->
  <nav class="navbar">
    <div class="container" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
      <span class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 6V4M8 6V4M16 6V4M4 6h16v14H4z"/>
          <path d="M8 10h8M8 14h6"/>
        </svg>
        School ERP
      </span>
      <div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap;">
        <div class="nav-links">
          <a href="index.html">Dashboard</a>
          <a href="students.html">Students</a>
          <a href="fees.html">Fees</a>
        </div>
        <!-- Global Search (same as other pages) -->
        <div class="search-container">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="globalSearchInput" placeholder="Search students...">
          <div class="search-results" id="globalSearchResults"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="container" style="padding-top: 32px;">
    <div id="profileContent">
      <!-- Loading State -->
      <div class="loading-spinner" id="loadingState">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--accent-color)" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>
        </svg>
        <div>Loading student profile...</div>
      </div>
      
      <!-- Profile will be rendered here by profile.js -->
      <div id="profileData" style="display: none;"></div>
    </div>
  </main>

  <!-- ========== STUDENT PROFILE MODAL (for receipt preview) ========== -->
  <div class="modal-overlay" id="receiptModal">
    <div class="modal" style="max-width: 700px;">
      <div class="modal-header">
        <h3>Payment Receipt</h3>
        <button class="modal-close" onclick="closeModal('receiptModal')">&times;</button>
      </div>
      <div id="receiptContent">
        <!-- dynamically filled -->
      </div>
      <div style="display: flex; gap: 12px; justify-content: end; margin-top: 20px;">
        <button class="btn btn-primary btn-print" onclick="window.print()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M18 9H6"/>
            <rect x="6" y="14" width="12" height="8"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/>
          </svg>
          Print / PDF
        </button>
        <button class="btn btn-outline-secondary" onclick="closeModal('receiptModal')">Close</button>
      </div>
    </div>
  </div>

  <!-- ========== ADD/EDIT STUDENT MODAL (reused from students.html) ========== -->
  <div class="modal-overlay" id="addStudentModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Edit Student</h3>
        <button class="modal-close" onclick="closeModal('addStudentModal')">&times;</button>
      </div>
      <form id="studentForm">
        <input type="hidden" id="editStudentId">
        <div class="form-row">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="studentName" required>
          </div>
          <div class="form-group">
            <label>Class</label>
            <select id="studentClass" required>
              <option value="Nursery">Nursery</option>
              <option value="LKG">LKG</option>
              <option value="UKG">UKG</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Section</label>
            <input type="text" id="studentSection" maxlength="1" placeholder="A" required>
          </div>
          <div class="form-group">
            <label>Roll No</label>
            <input type="number" id="studentRoll" required>
          </div>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="studentEmail" required>
        </div>
        <div class="form-group">
          <label>Phone (10 digits)</label>
          <input type="text" id="studentPhone" pattern="[0-9]{10}" required>
        </div>
        <div class="form-group">
          <label>Address</label>
          <textarea id="studentAddress" rows="2"></textarea>
        </div>
        <div style="display: flex; gap: 12px; justify-content: end;">
          <button type="button" class="btn btn-outline-secondary" onclick="closeModal('addStudentModal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveStudentBtn">Update</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== COLLECT FEE MODAL ========== -->
  <div class="modal-overlay" id="collectFeeModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Collect Fee</h3>
        <button class="modal-close" onclick="closeModal('collectFeeModal')">&times;</button>
      </div>
      <form id="feeForm">
        <input type="hidden" id="feeStudentId">
        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="feeAmount" placeholder="Enter amount" min="0" step="100" required>
        </div>
        <div style="display: flex; gap: 12px; justify-content: end;">
          <button type="button" class="btn btn-outline-secondary" onclick="closeModal('collectFeeModal')">Cancel</button>
          <button type="submit" class="btn btn-success">Pay & Generate Receipt</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="container">Yadav Web technologies</div>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/firebase-config.js"></script>
  <script src="js/script.js"></script>
  <script src="js/search.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
