<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Denied – Morning Glory English Academy</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        .denied-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--gray-50);
            padding: 20px;
            text-align: center;
        }
        .denied-card {
            background: #ffffff;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            padding: 48px 40px;
            max-width: 480px;
            width: 100%;
            border: 1px solid var(--gray-200);
        }
        .denied-card svg {
            color: var(--danger);
            margin-bottom: 16px;
        }
        .denied-card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 8px;
        }
        .denied-card p {
            color: var(--gray-600);
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .denied-card .btn-back {
            display: inline-block;
            padding: 10px 28px;
            background: var(--primary);
            color: #ffffff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background var(--transition-speed) ease;
        }
        .denied-card .btn-back:hover {
            background: var(--primary-dark);
        }
        .denied-card .btn-logout {
            display: inline-block;
            margin-left: 12px;
            padding: 10px 28px;
            background: var(--gray-200);
            color: var(--gray-700);
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all var(--transition-speed) ease;
            border: none;
            cursor: pointer;
        }
        .denied-card .btn-logout:hover {
            background: var(--gray-300);
        }
    </style>
</head>
<body>
    <div class="denied-wrapper">
        <div class="denied-card">
            <!-- SVG lock icon -->
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <h1>Access Denied</h1>
            <p>You do not have permission to view this page. Please contact your administrator if you believe this is an error.</p>
            <div>
                <a href="index.html" class="btn-back">Go to Dashboard</a>
                <button class="btn-logout" id="logoutBtn">Logout</button>
            </div>
        </div>
    </div>

    <!-- Firebase + RBAC for logout -->
    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
            }
        }
    </script>
    <script type="module">
        import { auth } from './js/firebase-init.js';
        import { signOut } from 'firebase/auth';

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
