<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · School ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- ===== NEW SEARCH CSS ===== -->
  <link rel="stylesheet" href="css/search.css">
  
  <!-- ===== FIREBASE SDK ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
</head>
<body>
  <!-- ========== NAVBAR (UPDATED with Search) ========== -->
  <nav class="navbar">
    <div class="container" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
      <span class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 6V4M8 6V4M16 6V4M4 6h16v14H4z"/>
          <path d="M8 10h8M8 14h6"/>
        </svg>
        School ERP
      </span>
      <div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap;">
        <div class="nav-links">
          <a href="index.html" class="active">Dashboard</a>
          <a href="students.html">Students</a>
          <a href="fees.html">Fees</a>
        </div>
        <!-- ===== GLOBAL SEARCH ===== -->
        <div class="search-container">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="globalSearchInput" placeholder="Search students...">
          <div class="search-results" id="globalSearchResults"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- ========== MAIN CONTENT (Unchanged) ========== -->
  <main class="container" style="padding-top: 32px;">
    <!-- Your existing dashboard content remains exactly the same -->
    <h1 style="margin-bottom: 24px; font-weight: 600;">Dashboard</h1>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; margin-bottom: 32px;">
      <div class="card" style="text-align: center; padding: 20px;">
        <div style="font-size: 2.2rem; font-weight: 700; color: var(--primary-dark);" id="totalStudents">0</div>
        <div style="color: var(--text-muted);">Total Students</div>
      </div>
      <div class="card" style="text-align: center; padding: 20px;">
        <div style="font-size: 2.2rem; font-weight: 700; color: var(--accent-color);" id="totalFeesCollected">₹0</div>
        <div style="color: var(--text-muted);">Fees Collected</div>
      </div>
      <div class="card" style="text-align: center; padding: 20px;">
        <div style="font-size: 2.2rem; font-weight: 700; color: #e11d48;" id="pendingFees">₹0</div>
        <div style="color: var(--text-muted);">Pending Fees</div>
      </div>
      <div class="card" style="text-align: center; padding: 20px;">
        <div style="font-size: 2.2rem; font-weight: 700; color: #d97706;" id="pendingCount">0</div>
        <div style="color: var(--text-muted);">Pending Students</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Recent Students</div>
      <div class="table-responsive">
        <table>
          <thead><tr><th>Name</th><th>Class</th><th>Section</th><th>Roll No</th></tr></thead>
          <tbody id="recentStudentsTable">
            <tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding: 40px 0;">Loading students...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Recent Fee Payments</div>
      <div class="table-responsive">
        <table>
          <thead><tr><th>Student</th><th>Amount</th><th>Date</th><th>Receipt</th></tr></thead>
          <tbody id="recentFeesTable">
            <tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding: 40px 0;">Loading fees...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ========== STUDENT PROFILE MODAL (NEW) ========== -->
  <div class="modal-overlay" id="studentProfileModal">
    <div class="modal" style="max-width: 640px;">
      <div class="modal-header">
        <h3>Student Profile</h3>
        <button class="modal-close" onclick="closeModal('studentProfileModal')">&times;</button>
      </div>
      <div id="studentProfileContent">
        <!-- Dynamically filled by search.js -->
      </div>
    </div>
  </div>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="container">Yadav Web technologies</div>
  </footer>

  <!-- ===== SCRIPTS (UPDATED) ===== -->
  <script src="js/firebase-config.js"></script>
  <script src="js/script.js"></script>
  <!-- ===== NEW SEARCH SCRIPT ===== -->
  <script src="js/search.js"></script>
  <!-- Dashboard logic remains unchanged -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Your existing dashboard code stays exactly the same
      // (I am keeping it here for completeness)
      function loadDashboardData() {
        const students = DataService.getStudents();
        const fees = DataService.getAllFees();

        document.getElementById('totalStudents').textContent = students.length;
        const totalCollected = fees.filter(f => f.status === 'paid').reduce((sum, f) => sum + f.amount, 0);
        document.getElementById('totalFeesCollected').textContent = formatCurrency(totalCollected);
        const pending = fees.filter(f => f.status === 'pending').reduce((sum, f) => sum + f.amount, 0);
        document.getElementById('pendingFees').textContent = formatCurrency(pending);
        const pendingCount = new Set(fees.filter(f => f.status === 'pending').map(f => f.studentId)).size;
        document.getElementById('pendingCount').textContent = pendingCount;

        const recentStudents = students.slice(-5).reverse();
        const recentStudentsBody = document.getElementById('recentStudentsTable');
        if (recentStudents.length === 0) {
          recentStudentsBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding: 40px 0;">No students added yet.</td></tr>`;
        } else {
          recentStudentsBody.innerHTML = recentStudents.map(s => `
            <tr>
              <td class="nowrap">${s.name}</td>
              <td>${s.class}</td>
              <td>${s.section}</td>
              <td class="rollno">${s.rollNo}</td>
            </tr>
          `).join('');
        }

        const recentFees = fees.slice(-5).reverse();
        const recentFeesBody = document.getElementById('recentFeesTable');
        if (recentFees.length === 0) {
          recentFeesBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted); padding: 40px 0;">No fee records found.</td></tr>`;
        } else {
          recentFeesBody.innerHTML = recentFees.map(f => {
            const student = DataService.getStudentById(f.studentId);
            return `
              <tr>
                <td class="nowrap">${student ? student.name : 'Unknown'}</td>
                <td class="amount">${formatCurrency(f.amount)}</td>
                <td class="nowrap">${f.paidDate || '—'}</td>
                <td class="nowrap">${f.receiptNo || '—'}</td>
              </tr>
            `;
          }).join('');
        }
      }

      loadDashboardData();
      window.addEventListener('dataChanged', loadDashboardData);
    });
  </script>
</body>
</html>
