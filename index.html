<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · School ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- page‑specific CSS (if any) -->
</head>
<body>
  <!-- Navbar (include on all pages) -->
  <nav class="navbar">
    <div class="container">
      <span class="brand">🏫 School ERP</span>
      <div class="nav-links">
        <a href="index.html" class="active">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="fees.html">Fees</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <h1 style="margin: 24px 0 16px;">Dashboard</h1>

    <!-- Stats Cards -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 20px; margin-bottom: 30px;">
      <div class="card" style="text-align: center;">
        <div style="font-size: 2rem; font-weight: 700; color: var(--primary-color);" id="totalStudents">0</div>
        <div style="color: var(--text-muted);">Total Students</div>
      </div>
      <div class="card" style="text-align: center;">
        <div style="font-size: 2rem; font-weight: 700; color: #28a745;" id="totalFeesCollected">0</div>
        <div style="color: var(--text-muted);">Fees Collected</div>
      </div>
      <div class="card" style="text-align: center;">
        <div style="font-size: 2rem; font-weight: 700; color: #dc3545;" id="pendingFees">0</div>
        <div style="color: var(--text-muted);">Pending Fees</div>
      </div>
    </div>

    <!-- Recent Students (Table) -->
    <div class="card">
      <div class="card-header">Recent Students</div>
      <div class="table-responsive">
        <table>
          <thead><tr><th>Name</th><th>Class</th><th>Section</th><th>Roll No</th></tr></thead>
          <tbody id="recentStudentsTable"></tbody>
        </table>
      </div>
    </div>

    <!-- Recent Fee Payments -->
    <div class="card">
      <div class="card-header">Recent Fee Payments</div>
      <div class="table-responsive">
        <table>
          <thead><tr><th>Student</th><th>Amount</th><th>Date</th><th>Receipt</th></tr></thead>
          <tbody id="recentFeesTable"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">Yadav Web technologies</div>
  </footer>

  <script src="js/script.js"></script>
  <script>
    // Dashboard logic – uses global DataService
    document.addEventListener('DOMContentLoaded', function() {
      const students = DataService.getStudents();
      const fees = DataService.getAllFees();

      // Stats
      document.getElementById('totalStudents').textContent = students.length;
      const totalCollected = fees.filter(f => f.status === 'paid').reduce((sum, f) => sum + f.amount, 0);
      document.getElementById('totalFeesCollected').textContent = formatCurrency(totalCollected);
      const pending = fees.filter(f => f.status === 'pending').reduce((sum, f) => sum + f.amount, 0);
      document.getElementById('pendingFees').textContent = formatCurrency(pending);

      // Recent students (last 5)
      const recentStudents = students.slice(-5).reverse();
      const tbody = document.getElementById('recentStudentsTable');
      tbody.innerHTML = recentStudents.map(s => `
        <tr><td>${s.name}</td><td>${s.class}</td><td>${s.section}</td><td>${s.rollNo}</td></tr>
      `).join('');

      // Recent fees (last 5)
      const recentFees = fees.slice(-5).reverse();
      const feesTbody = document.getElementById('recentFeesTable');
      feesTbody.innerHTML = recentFees.map(f => {
        const student = DataService.getStudentById(f.studentId);
        return `<tr>
          <td>${student ? student.name : 'Unknown'}</td>
          <td>${formatCurrency(f.amount)}</td>
          <td>${f.paidDate || '—'}</td>
          <td>${f.receiptNo || '—'}</td>
        </tr>`;
      }).join('');
    });
  </script>
</body>
</html>
