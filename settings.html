<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Settings – Morning Glory English Academy</title><link rel="stylesheet" href="css/style.css" /></head>
<body>
    <!-- SIDEBAR (active = settings) -->
    <aside class="sidebar" id="sidebar"> <!-- copy, set active to settings --> </aside>
    <div class="main-wrapper" id="mainWrapper">
        <header class="top-header"><!-- same --></header>
        <main class="page-content">
            <h2 style="margin-bottom:24px;">School Profile Settings</h2>
            <div class="card" style="max-width:800px;">
                <form id="settingsForm">
                    <div class="form-row">
                        <div class="form-group"><label>School Name</label><input type="text" class="form-input" value="Morning Glory English Academy" /></div>
                        <div class="form-group"><label>Affiliation / Board</label><input type="text" class="form-input" placeholder="e.g. CBSE, ICSE, State Board" /></div>
                    </div>
                    <div class="form-group"><label>Address Line 1</label><input type="text" class="form-input" placeholder="Street, Locality" /></div>
                    <div class="form-group"><label>Address Line 2</label><input type="text" class="form-input" placeholder="Landmark (optional)" /></div>
                    <div class="form-row">
                        <div class="form-group"><label>City</label><input type="text" class="form-input" placeholder="e.g. Kolkata" /></div>
                        <div class="form-group"><label>State</label><input type="text" class="form-input" placeholder="e.g. West Bengal" /></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>PIN Code</label><input type="text" class="form-input" placeholder="700001" /></div>
                        <div class="form-group"><label>Country</label><input type="text" class="form-input" value="India" readonly style="background:var(--gray-100);" /></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Phone Number</label><input type="tel" class="form-input" placeholder="+91 98765 43210" /></div>
                        <div class="form-group"><label>Email Address</label><input type="email" class="form-input" placeholder="info@morningschool.edu" /></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>GSTIN (optional)</label><input type="text" class="form-input" placeholder="22AAAAA0000A1Z5" /></div>
                        <div class="form-group"><label>PAN (optional)</label><input type="text" class="form-input" placeholder="ABCDE1234F" /></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Bank Account Holder</label><input type="text" class="form-input" placeholder="Morning Glory English Academy" /></div>
                        <div class="form-group"><label>Account Number</label><input type="text" class="form-input" placeholder="XXXXXXXXXXXX" /></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>IFSC Code</label><input type="text" class="form-input" placeholder="SBIN0001234" /></div>
                        <div class="form-group"><label>Bank Name</label><input type="text" class="form-input" placeholder="State Bank of India" /></div>
                    </div>
                    <button type="submit" class="btn-sm btn-primary" style="margin-top:8px;">Save Settings</button>
                </form>
            </div>
        </main>
        <footer class="site-footer"><!-- same --></footer>
    </div>
    <div class="sidebar-overlay"></div>
    <script src="js/script.js"></script>
</body>
</html>
