<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teachers – Morning Glory English Academy</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar"> <!-- same as students, but active=teachers --> </aside>
    <div class="main-wrapper" id="mainWrapper">
        <header class="top-header"><!-- same header --></header>
        <main class="page-content">
            <div class="action-bar">
                <div class="left">
                    <input type="text" class="form-input" placeholder="Search teacher..." style="width:260px;" />
                    <select class="form-select" style="width:160px;"><option value="">All Subjects</option><option>Mathematics</option><option>Science</option><option>English</option><option>Hindi</option><option>Social Studies</option><option>Computer</option></select>
                </div>
                <button class="btn-sm btn-primary" onclick="window.openModal('teacherModal')">+ Add Teacher</button>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead><tr><th>ID</th><th>Name</th><th>Subject</th><th>Qualification</th><th>Contact</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody id="teachersTableBody"><tr class="empty-row"><td colspan="7">Loading teachers...</td></tr></tbody>
                    </table>
                </div>
            </div>
        </main>
        <footer class="site-footer"><!-- same --></footer>
    </div>
    <!-- MODAL -->
    <div class="modal-backdrop"></div>
    <div class="modal" id="teacherModal">
        <div class="modal-content">
            <div class="modal-header"><h3>Add / Edit Teacher</h3><button class="modal-close">&times;</button></div>
            <form id="teacherForm">
                <input type="hidden" id="teacherId" />
                <div class="form-row">
                    <div class="form-group"><label>Teacher ID</label><input type="text" class="form-input" id="teacherIdField" placeholder="e.g. T001" required /></div>
                    <div class="form-group"><label>Full Name</label><input type="text" class="form-input" id="teacherName" placeholder="e.g. Ms. Priya" required /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Subject</label><input type="text" class="form-input" id="teacherSubject" placeholder="e.g. Mathematics" /></div>
                    <div class="form-group"><label>Qualification</label><input type="text" class="form-input" id="teacherQualification" placeholder="e.g. M.Sc., B.Ed." /></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Contact</label><input type="text" class="form-input" id="teacherContact" placeholder="+91 98765 43210" /></div>
                    <div class="form-group"><label>Base Salary (₹)</label><input type="number" class="form-input" id="teacherBaseSalary" placeholder="25000" /></div>
                </div>
                <div class="form-group"><label>Status</label><select class="form-select" id="teacherStatus"><option value="active">Active</option><option value="inactive">Inactive</option></select></div>
                <div class="modal-footer">
                    <button type="button" class="btn-sm modal-cancel">Cancel</button>
                    <button type="submit" class="btn-sm btn-primary">Save Teacher</button>
                </div>
            </form>
        </div>
    </div>
    <div class="sidebar-overlay"></div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
