<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fees · School ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/fees.css">
  
  <!-- ===== FIREBASE SDK (added) ===== -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
</head>
<body>
  <!-- ========== NAVBAR (Consistent with Dashboard) ========== -->
  <nav class="navbar">
    <div class="container">
      <span class="brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 6V4M8 6V4M16 6V4M4 6h16v14H4z"/>
          <path d="M8 10h8M8 14h6"/>
        </svg>
        School ERP
      </span>
      <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="students.html">Students</a>
        <a href="fees.html" class="active">Fees</a>
      </div>
    </div>
  </nav>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="container" style="padding-top: 32px;">
    <h1 style="margin-bottom: 24px; font-weight: 600;">Fee Management</h1>

    <!-- Summary Cards -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 24px; margin-bottom: 32px;">
      <div class="card" style="text-align: center; padding: 20px;">
        <div style="font-size: 1.8rem; font-weight: 700; color: var(--accent-color);" id="totalCollected">₹0</div>
        <div style="color: var(--text-muted);">Total Collected</div>
      </div>
      <div class="card" style="text-align: center; padding: 20px;">
        <div style="font-size: 1.8rem; font-weight: 700; color: #e11d48;" id="totalPending">₹0</div>
        <div style="color: var(--text-muted);">Total Pending</div>
      </div>
      <div class="card" style="text-align: center; padding: 20px;">
        <div style="font-size: 1.8rem; font-weight: 700; color: #d97706;" id="studentsWithPending">0</div>
        <div style="color: var(--text-muted);">Students with Pending</div>
      </div>
    </div>

    <!-- Record Payment -->
    <div class="card">
      <div class="card-header">Record Payment</div>
      <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: end;">
        <div class="form-group" style="flex:2; min-width:200px;">
          <label>Student</label>
          <select id="feeStudentSelect"></select>
        </div>
        <div class="form-group" style="flex:1; min-width:150px;">
          <label>Amount (₹)</label>
          <input type="number" id="feeAmount" placeholder="e.g. 5000" min="0" step="100">
        </div>
        <div class="form-group" style="flex:0;">
          <button class="btn btn-success" onclick="recordPayment()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"/>
            </svg>
            Pay
          </button>
        </div>
      </div>
      <div style="margin-top: 12px; font-size: 14px; color: var(--text-muted); min-height: 24px;" id="selectedStudentInfo">
        <!-- Will show selected student's fee summary -->
      </div>
    </div>

    <!-- Fee History -->
    <div class="card">
      <div class="card-header">Fee History</div>
      <div class="table-responsive">
        <table>
          <thead>
            <tr><th>Student</th><th>Amount</th><th>Date</th><th>Receipt No</th><th>Status</th></tr>
          </thead>
          <tbody id="feeHistoryTable">
            <tr>
              <td colspan="5" style="text-align:center; color:var(--text-muted); padding: 40px 0;">
                Loading fees...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- ========== RECEIPT MODAL ========== -->
  <div class="modal-overlay" id="receiptModal">
    <div class="modal" style="max-width: 700px;">
      <div class="modal-header">
        <h3>Payment Receipt</h3>
        <button class="modal-close" onclick="closeModal('receiptModal')">&times;</button>
      </div>
      <div id="receiptContent">
        <!-- dynamically filled by JS -->
      </div>
      <div style="display: flex; gap: 12px; justify-content: end; margin-top: 20px;">
        <button class="btn btn-primary btn-print" onclick="window.print()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M18 9H6"/>
            <rect x="6" y="14" width="12" height="8"/>
            <path d="M6 18H4a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/>
          </svg>
          Print / PDF
        </button>
        <button class="btn btn-outline-secondary" onclick="closeModal('receiptModal')">Close</button>
      </div>
    </div>
  </div>

  <!-- ========== FOOTER (Consistent with Dashboard) ========== -->
  <footer class="footer">
    <div class="container">Yadav Web technologies</div>
  </footer>

  <!-- ===== SCRIPTS (Updated order) ===== -->
  <script src="js/firebase-config.js"></script>
  <script src="js/script.js"></script>
  <script src="js/fees.js"></script>
</body>
</html>
