<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Fees – Morning Glory English Academy</title><link rel="stylesheet" href="css/style.css" /></head>
<body>
    <!-- SIDEBAR (active = fees) -->
    <aside class="sidebar" id="sidebar"> <!-- copy, set active to fees --> </aside>
    <div class="main-wrapper" id="mainWrapper">
        <header class="top-header"><!-- same --></header>
        <main class="page-content">
            <div class="action-bar">
                <div class="left">
                    <select class="form-select" style="width:160px;"><option value="">All Classes</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option></select>
                    <select class="form-select" style="width:160px;"><option value="">All Status</option><option>Paid</option><option>Unpaid</option><option>Pending</option></select>
                </div>
                <button class="btn-sm btn-success">+ Collect Fees</button>
            </div>
            <div class="card">
                <div class="table-responsive">
                    <table class="data-table">
                        <thead><tr><th>Student</th><th>Class</th><th>Month / Year</th><th>Amount (₹)</th><th>Due Date</th><th>Status</th></tr></thead>
                        <tbody id="feesTableBody"><tr class="empty-row"><td colspan="6">No fee records available.</td></tr></tbody>
                    </table>
                </div>
            </div>
        </main>
        <footer class="site-footer"><!-- same --></footer>
    </div>
    <div class="sidebar-overlay"></div>
    <script src="js/script.js"></script>
</body>
</html>
